name: Block Renovation
description: >-
  Block Renovation is a home renovation and construction platform that connects homeowners with vetted,
  local contractors and provides free design, cost-estimation, and project-planning tools for kitchen and
  bathroom remodels, home additions, basement renovations, ADUs, new construction, and commercial projects.
  It operates across all 50 US states and layers on a protection program covering price assurance,
  progress-based payments, a workmanship warranty, and dedicated Project Planner support. Backed by Obvious
  Ventures and the SoftBank Vision Fund, it was added to the API Evangelist network as a company profile;
  as of this enrichment pass Block Renovation publishes a consumer-facing marketplace but no public
  developer API, documentation, or machine-readable specification.
